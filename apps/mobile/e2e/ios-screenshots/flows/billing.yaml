appId: com.anviq.app
name: Billing
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ANVIQ_ACTIVE_EMAIL: ${ANVIQ_SCREENSHOT_EMAIL}
- openLink: "anviq:///billing"
- extendedWaitUntil:
    visible: ".*Renews.*|.*Plan.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-billing
- openLink: "anviq:///wallet"
- extendedWaitUntil:
    visible: "Disconnect"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-wallet
