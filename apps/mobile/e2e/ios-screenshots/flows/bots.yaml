appId: com.anviq.app
name: Bots
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ANVIQ_ACTIVE_EMAIL: ${ANVIQ_SCREENSHOT_EMAIL}
- openLink: "anviq:///bot-profile?botId=${ANVIQ_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*Routines.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-bot-profile
- tapOn: ".*Routines.*"
- extendedWaitUntil:
    visible: ".*Weekly fixture review.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-routines
- openLink: "anviq:///bot-model?botId=${ANVIQ_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*Space default.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-bot-model
- openLink: "anviq:///peer-chat?botId=${ANVIQ_SCREENSHOT_BOT_ID}&botName=Researcher&peerBotId=${ANVIQ_SCREENSHOT_PEER_BOT_ID}&peerBotName=Writer"
- extendedWaitUntil:
    visible: ".*draft the announcement.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-peer-chat
